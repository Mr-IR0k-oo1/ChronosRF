services:
  db:
    image: postgres:15
    container_name: chronosrf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestor:
    build:
      context: ./docker/ingestor
    container_name: chronosrf-ingestor
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
      POLL_INTERVAL: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./recordings:/data/recordings:ro

networks:
  default:
    name: chronosrf-network
